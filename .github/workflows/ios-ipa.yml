name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Marketing version; empty keeps pubspec value
        required: false
        default: ''
      build_number:
        description: Build number; empty keeps pubspec value
        required: false
        default: ''
      strip_app_groups:
        description: Remove App Groups entitlements (needed for free Apple IDs)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Add charset dependency
        run: |
          set -euo pipefail
          # GBK 解码需要 charset 包（Dart 内置 codec 里没有 GBK）。
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          if 'charset:' not in text:
              text = re.sub(r'(?m)^dependencies:\n', 'dependencies:\n  charset: ^2.0.1\n', text, count=1)
              path.write_text(text, encoding='utf-8')
          print('charset ready')
          PY
          grep -n 'charset' pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Apply reconstructed modules
        run: |
          set -euo pipefail
          cat > lib/lan_handoff_widgets.dart <<'DART_LIB_LAN_HANDOFF_WIDGETS_DART'
