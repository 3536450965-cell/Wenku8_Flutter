name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Marketing version; empty keeps pubspec value
        required: false
        default: ''
      build_number:
        description: Build number; empty keeps pubspec value
        required: false
        default: ''
      strip_app_groups:
        description: Remove App Groups entitlements (needed for free Apple IDs)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Apply reconstructed modules
        run: |
          set -euo pipefail
          cat > lib/lan_handoff_widgets.dart <<'DART_LIB_LAN_HANDOFF_WIDGETS_DART'
          import 'package:flutter/widgets.dart';

          import 'lan_reading_sync.dart';

          /// Wraps the app so nearby receipts can interrupt the current screen.
          ///
          /// Nearby reading is unavailable in this build, so the monitor is a pass-through
          /// that never shows a notice.
          class LanHandoffMonitor extends StatefulWidget {
            const LanHandoffMonitor({
              super.key,
              required this.handoff,
              required this.onContinue,
              required this.reduceMotion,
              required this.noticeWrapper,
              required this.child,
            });

            final LanHandoff? handoff;
            final Future<void> Function(LanHandoffReceipt receipt) onContinue;
            final bool reduceMotion;
            final Widget Function(Widget notice) noticeWrapper;
            final Widget child;

            @override
            State<LanHandoffMonitor> createState() => _LanHandoffMonitorState();
          }

          class _LanHandoffMonitorState extends State<LanHandoffMonitor> {
            @override
            Widget build(BuildContext context) => widget.child;
          }
          DART_LIB_LAN_HANDOFF_WIDGETS_DART

