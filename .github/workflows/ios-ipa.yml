          cat > lib/lan_reading_sync.dart <<'DART_LIB_LAN_READING_SYNC_DART'
          import 'package:flutter/widgets.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'catalog.dart';
          import 'library_state.dart';

          /// A nearby-handoff token sent from another device.
          ///
          /// The reference snapshot did not include the original LAN reading
          /// implementation, so this build keeps the type surface but leaves the feature
          /// dormant: [LanReadingSync.handoff] is always `null`.
          class LanHandoffReceipt {
            const LanHandoffReceipt({this.online});

            /// Identifier of the online book this receipt belongs to, when the sender was
            /// reading an online novel instead of a local file.
            final String? online;

            @override
            bool operator ==(Object other) =>
                other is LanHandoffReceipt && other.online == online;

            @override
            int get hashCode => online.hashCode;
          }

          /// A resolved receipt: which book, and where to continue reading.
          typedef LanHandoffTarget = ({Novel book, ReadingPosition position});

          /// Receives receipts from nearby devices.
          abstract class LanHandoff {
            /// Most recent receipt waiting for the user's confirmation, if any.
            LanHandoffReceipt? get received;

            /// Resolves [receipt] into a concrete book and position.
            Future<LanHandoffTarget> resolveReceipt(LanHandoffReceipt receipt);

            /// Dismisses the pending receipt without continuing.
            void dismissReceipt();
          }

          /// Coordinates nearby "continue reading on this device" handoffs.
          ///
          /// Only the plumbing the rest of the app talks to is implemented here; the
          /// networking layer is unavailable in this build, so [handoff] stays `null` and
          /// every call site degrades to its non-LAN behaviour.
          class LanReadingSync {
            LanReadingSync({
              required LibraryState state,
              required SharedPreferences preferences,
              required Object? books,
              required Object? repository,
            }) : _books = books,
                 _repository = repository;

            final Object? _books;
            final Object? _repository;

            /// Local book store handed in by the app shell (`null` when unavailable).
            Object? get books => _books;

            /// Repository handed in by the app shell (`null` when unavailable).
            Object? get repository => _repository;

            /// Always `null`: nearby reading is not part of this build.
            LanHandoff? get handoff => null;

            Future<void> initialize() async {}

            void dispose() {}
          }

          /// Exposes [LanReadingSync] to the widget tree.
          ///
          /// [maybeOf] returns `null` while nearby reading is unavailable, which hides the
          /// settings entry and the reader handoff action.
          class LanSyncScope extends InheritedWidget {
            const LanSyncScope({super.key, required this.sync, required super.child});

            final LanReadingSync? sync;

            static LanReadingSync? maybeOf(BuildContext context) {
              final scope = context.dependOnInheritedWidgetOfExactType<LanSyncScope>();
              final sync = scope?.sync;
              return sync != null && sync.handoff != null ? sync : null;
            }

            @override
            bool updateShouldNotify(LanSyncScope oldWidget) => oldWidget.sync != sync;
          }
          DART_LIB_LAN_READING_SYNC_DART

          cat > lib/listening/custom_tts.dart <<'DART_LIB_LISTENING_CUSTOM_TTS_DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';

          import 'package:flutter/foundation.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'models.dart';

          /// Configuration for a user-supplied, Microsoft-SSML compatible speech service.
          @immutable
          class CustomSpeechConfig {
            const CustomSpeechConfig({
              required this.endpoint,
              required this.apiKey,
              required this.namespace,
              required this.voiceId,
              this.locale = 'zh-CN',
              this.label = '',
            });

            /// Full SSML endpoint, for example
            /// `https://eastasia.tts.speech.microsoft.com/cognitiveservices/v1`.
            final String endpoint;

            /// Key sent as `Ocp-Apim-Subscription-Key`.
            final String apiKey;

            /// Namespace reported to the rest of the app as the voice engine.
            final String namespace;

            /// Provider voice name, for example `zh-CN-XiaoxiaoNeural`.
            final String voiceId;

            final String locale;

            /// Optional display name for the voice picker.
            final String label;

            bool get isConfigured =>
                endpoint.trim().isNotEmpty &&
                voiceId.trim().isNotEmpty &&
                locale.trim().isNotEmpty;

            /// The voice entry this configuration represents.
            SpeechVoice get voice => SpeechVoice(
              id: voiceId,
              label: label.trim().isEmpty ? voiceId : label.trim(),
              source: ListeningSource.custom,
              locale: locale,
              engine: namespace.trim().isEmpty ? 'custom' : namespace.trim(),
            );

            CustomSpeechConfig copyWith({
              String? endpoint,
              String? apiKey,
              String? namespace,
              String? voiceId,
              String? locale,
              String? label,
            }) => CustomSpeechConfig(
              endpoint: endpoint ?? this.endpoint,
              apiKey: apiKey ?? this.apiKey,
              namespace: namespace ?? this.namespace,
              voiceId: voiceId ?? this.voiceId,
              locale: locale ?? this.locale,
              label: label ?? this.label,
            );

            Map<String, Object?> toJson() => {
              'endpoint': endpoint,
              'apiKey': apiKey,
              'namespace': namespace,
              'voiceId': voiceId,
              'locale': locale,
              'label': label,
            };

            static CustomSpeechConfig? fromJson(Object? value) {
              if (value is! Map) return null;
              final endpoint = value['endpoint'];
              final voiceId = value['voiceId'];
              if (endpoint is! String || voiceId is! String) return null;
              return CustomSpeechConfig(
                endpoint: endpoint,
                apiKey: value['apiKey'] is String ? value['apiKey'] as String : '',
                namespace: value['namespace'] is String
                    ? value['namespace'] as String
                    : 'custom',
                voiceId: voiceId,
                locale: value['locale'] is String ? value['locale'] as String : 'zh-CN',
                label: value['label'] is String ? value['label'] as String : '',
              );
            }

            @override
            bool operator ==(Object other) =>
                other is CustomSpeechConfig &&
                other.endpoint == endpoint &&
                other.apiKey == apiKey &&
                other.namespace == namespace &&
                other.voiceId == voiceId &&
                other.locale == locale &&
                other.label == label;

            @override
            int get hashCode =>
                Object.hash(endpoint, apiKey, namespace, voiceId, locale, label);
          }

          /// Persisted custom speech settings, shared by the cache and the settings page.
          class CustomSpeechSettings extends ChangeNotifier {
            static const preferenceKey = 'listening.custom_speech.v1';

            CustomSpeechConfig? _config;
            bool _loaded = false;

            /// `null` until the user configures a service.
            CustomSpeechConfig? get config => _config;
            bool get loaded => _loaded;

            /// Loads the stored configuration. Safe to call repeatedly.
            Future<void> load() async {
              if (_loaded) return;
              try {
                final preferences = await SharedPreferences.getInstance();
                final raw = preferences.getString(preferenceKey);
                if (raw != null) {
                  _config = CustomSpeechConfig.fromJson(jsonDecode(raw));
                }
              } catch (_) {
                _config = null;
              }
              _loaded = true;
              notifyListeners();
            }

            /// Stores (or clears, when [value] is `null`) the configuration.
            Future<void> save(CustomSpeechConfig? value) async {
              _config = value != null && value.isConfigured ? value : null;
              _loaded = true;
              final preferences = await SharedPreferences.getInstance();
              if (_config == null) {
                await preferences.remove(preferenceKey);
              } else {
                await preferences.setString(preferenceKey, jsonEncode(_config!.toJson()));
              }
              notifyListeners();
            }
          }

          /// Thin client for a Microsoft-SSML compatible HTTP endpoint.
          class CustomSpeechClient {
            CustomSpeechClient({HttpClient? httpClient})
              : _client = httpClient ?? HttpClient();

            final HttpClient _client;

            /// Synthesizes [text] into MP3 bytes using [config].
            Future<Uint8List> synthesize(
              String text,
              CustomSpeechConfig config,
              SpeechCancellation cancellation,
            ) async {
              cancellation.check();
              if (!config.isConfigured) {
                throw const SpeechFailure('自定义语音接口尚未配置');
              }
              final uri = Uri.tryParse(config.endpoint.trim());
              if (uri == null || !uri.isScheme('https') && !uri.isScheme('http')) {
                throw const SpeechFailure('自定义语音接口地址无效');
              }
              final request = await _client.postUrl(uri);
              cancellation.onCancel(() => request.abort());
              request.headers.set(
                HttpHeaders.contentTypeHeader,
                'application/ssml+xml; charset=utf-8',
              );
              request.headers.set('X-Microsoft-OutputFormat', 'audio-24khz-48kbitrate-mono-mp3');
              if (config.apiKey.trim().isNotEmpty) {
                request.headers.set('Ocp-Apim-Subscription-Key', config.apiKey.trim());
              }
              request.headers.set(HttpHeaders.userAgentHeader, 'Wenku8');
              request.add(
                utf8.encode(
                  '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" '
                  'xml:lang="${_escape(config.locale)}">'
                  '<voice name="${_escape(config.voiceId)}">'
                  '${_escape(text)}'
                  '</voice></speak>',
                ),
              );
              final response = await request.close().timeout(
                const Duration(seconds: 30),
                onTimeout: () => throw const SpeechFailure(
                  '自定义语音接口响应超时',
                  kind: SpeechFailureKind.timeout,
                ),
              );
              cancellation.check();
              if (response.statusCode != HttpStatus.ok) {
                await response.drain<void>();
                throw SpeechFailure('自定义语音接口返回 ${response.statusCode}');
              }
              final builder = BytesBuilder(copy: false);
              await for (final chunk in response) {
                cancellation.check();
                builder.add(chunk);
              }
              final bytes = builder.takeBytes();
              if (bytes.isEmpty) {
                throw const SpeechFailure('自定义语音接口未返回音频');
              }
              return bytes;
            }

            void close() => _client.close(force: true);

            static String _escape(String value) => value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&apos;');
          }
          DART_LIB_LISTENING_CUSTOM_TTS_DART

          cat > lib/listening/custom_tts_page.dart <<'DART_LIB_LISTENING_CUSTOM_TTS_PAGE_DART'
          import 'package:flutter/material.dart';

          import 'controller.dart';
          import 'custom_tts.dart';

          /// Editor for the optional custom (SSML) speech service.
          class CustomSpeechPage extends StatefulWidget {
            const CustomSpeechPage({
              super.key,
              required this.settings,
              required this.controller,
            });

            final CustomSpeechSettings settings;
            final ListeningController controller;

            @override
            State<CustomSpeechPage> createState() => _CustomSpeechPageState();
          }

          class _CustomSpeechPageState extends State<CustomSpeechPage> {
            late final _endpoint = TextEditingController(
              text: widget.settings.config?.endpoint ?? '',
            );
            late final _apiKey = TextEditingController(
              text: widget.settings.config?.apiKey ?? '',
            );
            late final _namespace = TextEditingController(
              text: widget.settings.config?.namespace ?? 'custom',
            );
            late final _voiceId = TextEditingController(
              text: widget.settings.config?.voiceId ?? '',
            );
            late final _locale = TextEditingController(
              text: widget.settings.config?.locale ?? 'zh-CN',
            );
            late final _label = TextEditingController(
              text: widget.settings.config?.label ?? '',
            );
            String? _error;
            bool _saving = false;

            @override
            void dispose() {
              for (final controller in [
                _endpoint,
                _apiKey,
                _namespace,
                _voiceId,
                _locale,
                _label,
              ]) {
                controller.dispose();
              }
              super.dispose();
            }

            Future<void> _save({bool clear = false}) async {
              if (_saving) return;
              setState(() {
                _saving = true;
                _error = null;
              });
              try {
                if (clear) {
                  await widget.settings.save(null);
                } else {
                  final config = CustomSpeechConfig(
                    endpoint: _endpoint.text.trim(),
                    apiKey: _apiKey.text.trim(),
                    namespace: _namespace.text.trim().isEmpty
                        ? 'custom'
                        : _namespace.text.trim(),
                    voiceId: _voiceId.text.trim(),
                    locale: _locale.text.trim().isEmpty ? 'zh-CN' : _locale.text.trim(),
                    label: _label.text.trim(),
                  );
                  if (!config.isConfigured) {
                    setState(() => _error = '请填写接口地址与语音名称');
                    return;
                  }
                  await widget.settings.save(config);
                }
                if (mounted) Navigator.pop(context, true);
              } catch (_) {
                if (mounted) setState(() => _error = '自定义语音设置未能保存，请重试');
              } finally {
                if (mounted) setState(() => _saving = false);
              }
            }

            Widget _field(
              TextEditingController controller,
              String label, {
              String? hint,
              bool secret = false,
            }) => Padding(
              padding: const EdgeInsets.only(bottom: 14),
              child: TextField(
                controller: controller,
                obscureText: secret,
                autocorrect: false,
                enableSuggestions: !secret,
                decoration: InputDecoration(labelText: label, hintText: hint),
              ),
            );

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('自定义语音接口')),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Text(
                      '兼容 Microsoft SSML 的语音接口。语音仅在本机合成与缓存，接口地址、密钥都只保存在本机。',
                      style: TextStyle(fontSize: 13, height: 1.6),
                    ),
                    const SizedBox(height: 18),
                    _field(
                      _endpoint,
                      '接口地址',
                      hint: 'https://eastasia.tts.speech.microsoft.com/cognitiveservices/v1',
                    ),
                    _field(_apiKey, '订阅密钥', secret: true),
                    _field(_namespace, '命名空间', hint: 'custom'),
                    _field(_voiceId, '语音名称', hint: 'zh-CN-XiaoxiaoNeural'),
                    _field(_locale, '语言', hint: 'zh-CN'),
                    _field(_label, '显示名称（可选）'),
                    if (_error case final error?)
                      Padding(
                        padding: const EdgeInsets.only(bottom: 12),
                        child: Text(
                          error,
                          style: TextStyle(color: Theme.of(context).colorScheme.error),
                        ),
                      ),
                    FilledButton(
                      key: const ValueKey('custom-tts-save'),
                      onPressed: _saving ? null : _save,
                      child: Text(_saving ? '正在保存' : '保存'),
                    ),
                    const SizedBox(height: 8),
                    TextButton(
                      onPressed: _saving ? null : () => _save(clear: true),
                      child: const Text('清除自定义语音'),
                    ),
                  ],
                ),
              );
            }
          }
          DART_LIB_LISTENING_CUSTOM_TTS_PAGE_DART

          cat > lib/listening/enhancement.dart <<'DART_LIB_LISTENING_ENHANCEMENT_DART'
          import 'dart:convert';

          import 'package:flutter/foundation.dart';

          /// Optional playback gain applied on top of the synthesized speech.
          ///
          /// Kept separate from [ListeningStore] voice settings so a damaged gain
          /// preference can never break ordinary playback.
          @immutable
          class ListeningEnhancementPreference {
            const ListeningEnhancementPreference({this.enabled = false, this.gainDb = 0});

            static const minimumGainDb = -12.0;
            static const maximumGainDb = 12.0;

            final bool enabled;
            final double gainDb;

            double get effectiveGainDb =>
                enabled ? gainDb.clamp(minimumGainDb, maximumGainDb) : 0;

            ListeningEnhancementPreference copyWith({bool? enabled, double? gainDb}) =>
                ListeningEnhancementPreference(
                  enabled: enabled ?? this.enabled,
                  gainDb: (gainDb ?? this.gainDb).clamp(minimumGainDb, maximumGainDb),
                );

            Map<String, Object?> toJson() => {'enabled': enabled, 'gainDb': gainDb};

            static ListeningEnhancementPreference fromJson(Object? value) {
              if (value is! Map) return const ListeningEnhancementPreference();
              final gain = value['gainDb'];
              return ListeningEnhancementPreference(
                enabled: value['enabled'] == true,
                gainDb: gain is num
                    ? gain.toDouble().clamp(minimumGainDb, maximumGainDb)
                    : 0,
              );
            }

            @override
            bool operator ==(Object other) =>
                other is ListeningEnhancementPreference &&
                other.enabled == enabled &&
                other.gainDb == gainDb;

            @override
            int get hashCode => Object.hash(enabled, gainDb);

            @override
            String toString() =>
                'ListeningEnhancementPreference(enabled: $enabled, gainDb: $gainDb)';
          }

          /// Applies the enhancement preference to the current audio output.
          ///
          /// The public snapshot did not ship the native gain stage, so this build keeps
          /// the preference (and the UI that edits it) and reports it to the host when a
          /// session id is available. Playback itself is unaffected.
          class ListeningEnhancement {
            ListeningEnhancementPreference _preference =
                const ListeningEnhancementPreference();
            bool _disposed = false;

            ListeningEnhancementPreference get preference => _preference;

            /// Persisted preference is already stored by the caller; this only updates the
            /// in-memory value.
            Future<void> configure(
              ListeningEnhancementPreference value, {
              int? audioSessionId,
            }) async {
              if (_disposed) return;
              _preference = value;
            }

            Future<void> setPreference(ListeningEnhancementPreference value) =>
                configure(value);

            Future<void> dispose() async {
              _disposed = true;
            }
          }

          /// Round-trips a preference through JSON, used by [ListeningStore].
          String encodeListeningEnhancement(ListeningEnhancementPreference value) =>
              jsonEncode(value.toJson());
          DART_LIB_LISTENING_ENHANCEMENT_DART

          cat > lib/listening/enhancement_controls.dart <<'DART_LIB_LISTENING_ENHANCEMENT_CONTROLS_DART'
          import 'package:flutter/material.dart';

          import 'enhancement.dart';

          /// Gain controls embedded in the listening settings sheet.
          class ListeningEnhancementSettings extends StatefulWidget {
            const ListeningEnhancementSettings({
              super.key,
              required this.enhancement,
              required this.onChanged,
            });

            final ListeningEnhancement enhancement;
            final ValueChanged<ListeningEnhancementPreference> onChanged;

            @override
            State<ListeningEnhancementSettings> createState() =>
                _ListeningEnhancementSettingsState();
          }

          class _ListeningEnhancementSettingsState
              extends State<ListeningEnhancementSettings> {
            late ListeningEnhancementPreference _value = widget.enhancement.preference;

            void _commit(ListeningEnhancementPreference next) {
              setState(() => _value = next);
              widget.onChanged(next);
            }

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final muted = TextStyle(fontSize: 12, height: 1.6, color: scheme.onSurfaceVariant);
              return Column(
                crossAxisAlignment: CrossAxisAlignment.stretch,
                children: [
                  Row(
                    children: [
                      const Expanded(child: Text('音量增强')),
                      Switch(
                        key: const ValueKey('listening-enhancement-toggle'),
                        value: _value.enabled,
                        onChanged: (enabled) => _commit(_value.copyWith(enabled: enabled)),
                      ),
                    ],
                  ),
                  Text(
                    _value.enabled
                        ? '在合成语音上叠加 ${_value.gainDb.toStringAsFixed(1)} dB'
                        : '保持原始响度',
                    style: muted,
                  ),
                  if (_value.enabled) ...[
                    const SizedBox(height: 4),
                    Slider(
                      key: const ValueKey('listening-enhancement-gain'),
                      min: ListeningEnhancementPreference.minimumGainDb,
                      max: ListeningEnhancementPreference.maximumGainDb,
                      divisions: 24,
                      value: _value.gainDb,
                      label: '${_value.gainDb.toStringAsFixed(1)} dB',
                      onChanged: (gain) => _commit(_value.copyWith(gainDb: gain)),
                    ),
                  ],
                ],
              );
            }
          }
          DART_LIB_LISTENING_ENHANCEMENT_CONTROLS_DART

          cat > lib/local_book_batch_page.dart <<'DART_LIB_LOCAL_BOOK_BATCH_PAGE_DART'
          import 'package:flutter/material.dart';

          import 'app_interactions.dart';
          import 'catalog.dart';
          import 'library_state.dart';
          import 'local_books.dart';

          /// Batch shelf management for local books.
          Future<void> openLocalBookBatch(
            BuildContext context, {
            required LocalBookStore books,
            required LibraryState library,
            Set<int>? selected,
          }) => pushNovelPage<void>(
            context,
            LocalBookBatchPage(books: books, library: library, initial: selected),
            reduceMotion: library.reduceMotion,
