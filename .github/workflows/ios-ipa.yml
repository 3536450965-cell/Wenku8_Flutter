              required this.data,
              required this.size,
              required this.brightness,
              this.quoteText,
              this.quoteSource = '',
              this.quoteCount = 0,
            });

            final ReadingWidgetSnapshot data;
            final ReadingDesktopSize size;
            final Brightness brightness;
            final String? quoteText;
            final String quoteSource;
