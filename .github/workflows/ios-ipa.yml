          class _ReadingDesktopCardState extends State<ReadingDesktopCard> {
            Future<Uint8List>? _bytes;
            Object? _signature;

            Object _currentSignature() => (
              widget.data.toJson(),
              widget.size,
              widget.brightness,
              widget.quoteText,
              widget.quoteSource,
            );

            Future<Uint8List> _render() => renderReadingDesktopCard(
              widget.data,
              widget.size,
              brightness: widget.brightness,
