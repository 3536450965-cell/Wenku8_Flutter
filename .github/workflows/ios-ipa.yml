          import Flutter
          import UIKit

          /// 公开快照没有包含这个插件，这里给出一个空实现，
          /// 只保证 `AppDelegate` 里的注册调用可以编译通过。
          /// 局域网发现在当前构建里不可用，调用会返回明确错误。
          final class NativeLanDiscoveryPlugin: NSObject, FlutterPlugin {
            static func register(with registrar: FlutterPluginRegistrar) {
              let channel = FlutterMethodChannel(
                name: "org.mewx.wenku8/lan_discovery", binaryMessenger: registrar.messenger())
              registrar.addMethodCallDelegate(NativeLanDiscoveryPlugin(), channel: channel)
            }

            func handle(_ call: FlutterMethodCall, result: @escaping FlutterResult) {
              result(FlutterError(code: "unavailable", message: "当前构建不支持局域网发现", details: nil))
            }
          }
          DART_IOS_RUNNER_NATIVELANDISCOVERYPLUGIN_SWIFT

          cat > ios/Runner/BookFolderScanner.swift <<'DART_IOS_RUNNER_BOOKFOLDERSCANNER_SWIFT'
          import Foundation

          /// 公开快照缺少文件夹扫描的原生实现。这里提供一个保守版本：
          /// 配置类调用是空操作，扫描返回空结果，暂存/链接直接报错。
          /// Dart 侧对 `scanFolderInfo == nil` 和空 `books` 都有处理，因此不会崩。
          final class BookFolderScanner {
            init(stateFile: URL, documentsDirectory: URL) throws {
              self.stateFile = stateFile
              self.documentsDirectory = documentsDirectory
            }

            private let stateFile: URL
            private let documentsDirectory: URL

            func info() throws -> Any? {
              return nil
            }

            func select(_ url: URL) throws -> Any? {
              return nil
            }

            func selectApplicationDocuments() throws -> Any? {
              return nil
            }

            func formats() throws -> Any? {
              return nil
            }

            func setFormats(_ extensions: [String]) throws {}

            func setAutomatic(_ value: Bool) throws {}

            func disconnect() throws {}

            func scan() throws -> Any? {
              return ["books": [Any](), "total": 0, "unchanged": 0, "warnings": [String]()]
            }

            func stage(_ token: String, documents: ManagedBookDocuments) throws -> Any? {
              throw BookDocumentFailure(code: "scan_unavailable", message: "当前构建不支持文件夹扫描导入")
            }

            func link(_ token: String, documents: LinkedBookDocuments) throws -> Any? {
              throw BookDocumentFailure(code: "scan_unavailable", message: "当前构建不支持文件夹扫描导入")
            }

            func markImported(_ token: String) throws {}

            func finish() throws {}
          }
          DART_IOS_RUNNER_BOOKFOLDERSCANNER_SWIFT

          cat > ios/Runner/NativeBookConversion.swift <<'DART_IOS_RUNNER_NATIVEBOOKCONVERSION_SWIFT'
          import Foundation

          /// 公开快照缺少 Kindle / PDF 转换的原生实现。
          /// 这两个能力依赖未公开的模块，这里统一给出可读的错误，
          /// Dart 侧会捕获并提示「当前构建不支持该格式」。
          final class NativeBookConversion {
            init(documents: ManagedBookDocuments, portableRoot: URL) throws {
              self.documents = documents
              self.portableRoot = portableRoot
            }

            private let documents: ManagedBookDocuments
            private let portableRoot: URL

            func extractKindle(_ path: String, output: String) throws -> Int {
              throw BookDocumentFailure(code: "format_unavailable", message: "当前构建不支持 MOBI / AZW3 转换，请先转换为 EPUB")
            }

            func extractPdf(_ path: String, output: String, name: String) throws {
              throw BookDocumentFailure(code: "format_unavailable", message: "当前构建不支持 PDF 导入，请先转换为 EPUB")
            }
          }

          /// 原件在公开快照里缺失，这里按 `lib/book_import_limits.dart` 的口径重建：
          /// 同名的 Dart 侧 `localBookByteLimit` / `supportsBookImport` 保持同一套限额。
          enum BookImportFormatPolicy {
            static let extensions: Set<String> = [
              "txt", "epub", "mobi", "azw", "azw3", "prc", "fb2", "pdf",
              "docx", "doc", "rtf", "html", "htm", "xhtml", "md", "markdown", "zip",
            ]

            private static func baseLimit(_ ext: String) -> Int64 {
              switch ext.lowercased() {
              case "zip", "epub", "pdf", "docx": return 512 * 1024 * 1024
              case "mobi", "azw", "azw3", "prc": return 256 * 1024 * 1024
              case "html", "htm", "xhtml", "md", "markdown": return 32 * 1024 * 1024
              default: return 128 * 1024 * 1024
              }
            }

            static func byteLimit<T: BinaryInteger>(_ ext: String) -> T {
              return T(baseLimit(ext))
            }
          }
          DART_IOS_RUNNER_NATIVEBOOKCONVERSION_SWIFT

          cat > ios/Runner/NativePdfImport.swift <<'DART_IOS_RUNNER_NATIVEPDFIMPORT_SWIFT'
          import Foundation

          /// 工程文件里引用了这个文件，但公开快照没有包含它，也没有任何调用方。
          /// 保留一个空类型即可满足 Xcode 的 Sources 编译单元。
          final class NativePdfImport {
            private init() {}
          }
          DART_IOS_RUNNER_NATIVEPDFIMPORT_SWIFT

      - name: Fill missing assets
        run: |
          set -euo pipefail
          # 公开快照没提交 assets/report/ 和 assets/reading_previews/*.webp，
          # 但 pubspec.yaml 仍声明它们，缺目录会让 flutter assemble 直接失败。
          mkdir -p assets/report assets/reading_previews
          printf 'placeholder\n' > assets/report/placeholder.txt
          for name in archive shelf editorial constellation signal score ink festival; do
            src="assets/reading_art/${name}-117.webp"
            dst="assets/reading_previews/${name}-117.webp"
            if [ ! -f "$dst" ]; then
              if [ -f "$src" ]; then cp "$src" "$dst"; else printf 'placeholder\n' > "$dst"; fi
            fi
          done
          ls -1 assets/reading_previews | head -20

      - name: Strip App Groups entitlements
        if: ${{ inputs.strip_app_groups }}
        run: |
          set -euo pipefail
          for file in ios/Runner/ReadingWidgets.entitlements ios/ReadingWidgets/ReadingWidgets.entitlements; do
            if [ -f "$file" ]; then
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0"><dict/></plist>' > "$file"
              echo "stripped $file"
            fi
          done

      - name: Build unsigned app
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          args=(--release --no-codesign --verbose)
          if [ -n "$BUILD_NAME" ]; then args+=(--build-name "$BUILD_NAME"); fi
          if [ -n "$BUILD_NUMBER" ]; then args+=(--build-number "$BUILD_NUMBER"); fi
          mkdir -p "$RUNNER_TEMP/ios-build"
          ( set -o pipefail; flutter build ios "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/ios-build/build-ios.log" )

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build/build-ios.log
          if-no-files-found: warn

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          name=${version%%+*}
          number=${version##*+}
          if [ "$number" = "$version" ]; then number=1; fi
          stamp=$(date +%Y%m%d)
          ipa="Wenku8-${name}-${number}-${stamp}-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$ipa" Payload
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wenku8-unsigned-ipa
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
