          class _Wenku8PageState extends State<Wenku8Page> {
            final _input = TextEditingController();
            final _client = Wenku8Client();

            Wenku8Book? _book;
            List<Wenku8Volume>? _volumes;
            String? _error;
            bool _busy = false;
            bool _cancelled = false;
            int _done = 0;
            int _total = 0;

            @override
            void dispose() {
              _client.dispose();
              _input.dispose();
              super.dispose();
            }

            Future<void> _resolve() async {
              final id = Wenku8Client.parseId(_input.text);
              if (id == null) {
                setState(() => _error = '请输入文库书籍编号或书籍页链接。');
                return;
              }
              setState(() {
                _busy = true;
                _error = null;
                _book = null;
                _volumes = null;
              });
              try {
                final book = await _client.book(id);
                final volumes = await _client.catalog(id);
                if (!mounted) return;
                setState(() {
                  _book = book;
                  _volumes = volumes;
                });
              } catch (error) {
                if (!mounted) return;
                setState(() => _error = '$error');
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            Future<void> _download() async {
              final book = _book;
              final volumes = _volumes;
              if (book == null || volumes == null) return;
              setState(() {
                _busy = true;
                _cancelled = false;
                _error = null;
                _done = 0;
                _total = 0;
              });
              try {
                final download = await _client.download(
                  book,
                  volumes,
                  isCancelled: () => _cancelled,
                  onProgress: (done, total) {
                    if (mounted) setState(() { _done = done; _total = total; });
                  },
                );
                if (_cancelled) throw Wenku8Exception('已取消。');
                final bytes = _client.epub(download);
                final directory = await getTemporaryDirectory();
                final file = File(
                  '${directory.path}/wenku8-${book.id}-${DateTime.now().millisecondsSinceEpoch}.epub',
                );
                await file.writeAsBytes(bytes, flush: true);
                final novel = await widget.books.importFile(book.fileName, file.path);
                await file.delete().catchError((_) => file);
                widget.onImported?.call(novel);
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('已导入《${novel.title}》')),
                );
                Navigator.of(context).pop(true);
              } catch (error) {
                if (!mounted) return;
                setState(() => _error = '$error');
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final muted = TextStyle(color: scheme.onSurfaceVariant, height: 1.7);
              final book = _book;
              final volumes = _volumes;
              final chapters = volumes == null
                  ? 0
                  : volumes.fold<int>(0, (sum, volume) => sum + volume.chapters.length);
              return Scaffold(
                appBar: AppBar(title: const Text('文库书源')),
                body: ListView(
                  padding: const EdgeInsets.fromLTRB(20, 12, 20, 32),
                  children: [
                    Text(
                      '在文库页面找一个书籍编号（wenku8.net/book/1234.htm 里的 1234），'
                      '或直接把整条链接粘进来。只抓取匿名可读的正文，然后转成 epub 放进本地书架。',
                      style: muted,
                    ),
                    const SizedBox(height: 16),
                    TextField(
                      controller: _input,
                      enabled: !_busy,
                      textInputAction: TextInputAction.search,
                      onSubmitted: (_) => _resolve(),
                      decoration: const InputDecoration(
                        labelText: '书籍编号或链接',
                        hintText: '例如 1234 或 https://www.wenku8.net/book/1234.htm',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Row(
                      children: [
                        FilledButton.icon(
                          onPressed: _busy ? null : _resolve,
                          icon: const Icon(Icons.travel_explore, size: 18),
                          label: const Text('解析'),
                        ),
                        const SizedBox(width: 12),
                        if (_busy && _total > 0)
                          TextButton(
                            onPressed: () => setState(() => _cancelled = true),
                            child: const Text('取消'),
