name: Wenku8 book index

# The app searches a bundled index because the site's own search needs an
# account nobody can create any more. New books take the next free id, so this
# weekly job only looks past the highest id we already know and commits the
# grown table; the app picks it up from data/wenku8_index.json within a couple
# of days (see Wenku8Index.load).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenku8-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe the site from this runner
        run: |
          for host in https://www.wenku8.cc https://www.wenku8.net; do
            for path in /book/4499.htm /book/3330.htm; do
              out="/tmp/p_$(echo "$host$path" | tr -c 'a-zA-Z0-9' '_').htm"
              code=$(curl -sS -m 20 -o "$out" -w '%{http_code}' -A 'Mozilla/5.0' "$host$path" 2>/tmp/err.txt) || code="curl-fail"
              bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
              echo "GET $host$path -> http=$code bytes=$bytes err=$(head -c 80 /tmp/err.txt 2>/dev/null | tr '\n' ' ')"
              if [ "$bytes" != "0" ]; then
                echo -n '  body: '
                head -c 160 "$out" | iconv -f gbk -t utf-8 2>/dev/null | tr '\n' ' ' || true
                echo
              fi
            done
          done
          true
      - name: Look for new books
        run: node tools/index_crawl.mjs

      - name: Commit the grown index
        run: |
          set -euo pipefail
          if git diff --quiet -- data/wenku8_index.json; then
            echo "index unchanged"
            exit 0
          fi
          rows=$(python3 -c "import json;print(len(json.load(open('data/wenku8_index.json'))))")
          git config user.name 'wenku8 index bot'
          git config user.email 'noreply@github.com'
          git add data/wenku8_index.json
          git commit -m "chore: refresh book index (${rows} books)"
          git push